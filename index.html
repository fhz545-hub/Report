<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تم ضم الخدمة إلى منصة منتظم</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">

<meta http-equiv="refresh" content="10;url=https://muntzm.com/">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"Tajawal",sans-serif;
  background:
    linear-gradient(180deg,rgba(255,255,255,.35),rgba(232,250,250,.92)),
    url("muntzm-cover.png") center/cover no-repeat;
  color:#082b4f;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  width:min(760px,100%);
  background:rgba(255,255,255,.88);
  border:1px solid rgba(0,168,168,.25);
  border-radius:28px;
  padding:34px 26px;
  text-align:center;
  box-shadow:0 20px 55px rgba(0,40,80,.16);
  backdrop-filter:blur(10px);
}
.logo{
  width:150px;
  margin-bottom:14px;
}
h1{
  margin:0 0 12px;
  font-size:clamp(26px,5vw,44px);
  font-weight:900;
  color:#062c55;
}
p{
  margin:8px auto;
  font-size:clamp(16px,3vw,22px);
  line-height:1.9;
  color:#16435f;
  max-width:640px;
}
.highlight{
  color:#079c9c;
  font-weight:900;
}
.count{
  margin:18px auto 22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#05b6b6,#062c55);
  color:#fff;
  font-size:26px;
  font-weight:900;
  box-shadow:0 10px 24px rgba(0,150,150,.25);
}
.btn{
  display:inline-block;
  background:linear-gradient(90deg,#062c55,#05a6a6);
  color:#fff;
  text-decoration:none;
  padding:13px 28px;
  border-radius:999px;
  font-weight:900;
  font-size:18px;
  box-shadow:0 10px 24px rgba(0,60,100,.22);
}
.note{
  margin-top:14px;
  font-size:14px;
  color:#5d7480;
}
</style>
</head>

<body>
  <main class="card">
    <h1>نعتذر لكم</h1>
    <p>
      تم ضم هذه الخدمة إلى <span class="highlight">منصة منتظم</span>
      ضمن خدمات إدارة وتنظيم العمل المدرسي.
    </p>
    <p>
      نرجو التسجيل في منصة منتظم للاستفادة من الخدمة بشكلها المطوّر.
    </p>

    <div class="count" id="count">10</div>

    <br>
    <a class="btn" href="https://muntzm.com/">الدخول إلى منصة منتظم</a>

    <div class="note">سيتم تحويلك تلقائيًا خلال ثوانٍ...</div>
  </main>

<script>
let seconds = 10;
const count = document.getElementById("count");

const timer = setInterval(() => {
  seconds--;
  count.textContent = seconds;

  if (seconds <= 0) {
    clearInterval(timer);
    window.location.href = "https://muntzm.com/";
  }
}, 1000);
</script>
</body>
</html>
