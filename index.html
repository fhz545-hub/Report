<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>تقرير تنفيذ برنامج — وزارة التعليم</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
:root{
  --ink:#1f2937; --muted:#6b7280; --line:#e3eef2;
  --paper:#ffffff; --bg:#f5f7fb;
  --accent:#2f7f79; --footer:#0e3b46;
  --base:14px; --title:18px; --name:17px;
}
*{box-sizing:border-box}
html,body{
  height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:"Tajawal",system-ui,sans-serif; line-height:1.6; font-size:var(--base);
}

/* ورقة A4 صفحة واحدة */
.sheet{
  width:210mm; height:297mm; margin:12px auto; background:var(--paper);
  border:1px solid #e5e7eb; box-shadow:0 10px 28px rgba(0,0,0,.08);
  display:grid; grid-template-rows: 30mm auto auto 6mm; overflow:hidden;
}

/* الهيدر */
.header-img{height:30mm; overflow:hidden; background:#eee; position:relative}
.header-img img{width:100%; height:100%; object-fit:cover; display:block}
.header-fallback{position:absolute; inset:0; background:linear-gradient(90deg,#0b7e88,#15a3ad); display:none}

/* العنوان */
.titlebar-wrap{display:grid; place-items:center; padding-top:4px; padding-bottom:0} /* قرّبناه أكثر */
.titlebar{
  display:inline-block; padding:6px 18px; border-radius:14px; background:var(--accent); color:#fff;
  font-weight:800; font-size:var(--title); text-align:center; max-width:72%; line-height:1.25;
  filter:drop-shadow(0 10px 8px rgba(0,0,0,.20));
}
.titlebar[contenteditable]:focus{outline:2px dashed rgba(255,255,255,.7); outline-offset:4px}

/* المحتوى (ثابت الارتفاعات) */
.main{
  padding:0 10mm; display:grid; gap:3mm; /* gap أصغر لرفع الجدول */
  grid-template-rows:
    auto     /* جدول التعريف (ارتفاع تلقائي صغير) */
    70mm     /* الأهداف + النبذة — ثابت */
    58mm     /* الشواهد — ثابت */
    22mm;    /* التواقيع — ثابت */
}

/* جدول التعريف — نسخة «مُصغّرة أنيقة» */
.table{
  width:100%; border-collapse:collapse; table-layout:fixed;
  background:#fff; border:1px solid var(--line);
  font-size:13px; /* أصغر من بقية الصفحة */
}
.table tr{}
.table th,.table td{
  border:1px solid var(--line);
  padding:2.2mm 3.2mm;       /* تقليل التباعد العمودي */
  line-height:1.4;           /* صفوف أكثر تماسكًا */
  vertical-align:top;
  word-break:break-word; overflow-wrap:anywhere;
}
.table th{
  width:24%;                  /* رأس أضيق قليلًا */
  background:#f4f9fa;
  color:#255c57;
  font-weight:800;
}
.table td{color:#111827}
.table [contenteditable]{outline:none}
.table [contenteditable]:focus{box-shadow:inset 0 0 0 2px rgba(47,127,121,.18); border-radius:4px}

/* بطاقات الأهداف/النبذة — ثابتة الارتفاع بدون تمرير */
.split{display:grid; grid-template-columns:1fr 1fr; gap:4mm; height:70mm}
.card{
  border:1px solid var(--line); border-radius:8px; background:#fff;
  display:grid; grid-template-rows:12mm 1fr; position:relative; overflow:hidden;
}
.card .head{
  padding:0 4mm; display:flex; align-items:center; background:#f3fafb; color:#0b7e88;
  font-weight:800; border-bottom:1px solid var(--line); font-size:var(--base)
}
.card .body{padding:3mm 4mm; overflow:hidden; display:flex; align-items:flex-start; justify-content:stretch}
.fittext{
  width:100%; height:100%;
  white-space:pre-wrap; word-break:break-word; overflow:hidden;
  line-height:1.6; font-size:15px; font-weight:400;
}

/* شريط الأدوات للنصوص (لا يظهر في PDF) */
.toolstrip{position:absolute; top:12mm; inset-inline-end:6px; z-index:5; display:flex; gap:6px}
.toolbtn{border:1px solid var(--line); background:#fff; color:#111; font-weight:800; padding:4px 8px; border-radius:8px; cursor:pointer; font-size:12px; box-shadow:0 2px 8px rgba(0,0,0,.08)}
.toolbtn:active{transform:scale(0.98)}

/* الشواهد — ثابتة الارتفاع */
.gallery{display:grid; grid-template-columns:1fr 1fr; gap:4mm; height:58mm}
.photo{
  position:relative; background:#fff; border:1px solid var(--line); border-radius:8px;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.photo input[type="file"]{position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2}
.photo .hint{position:absolute; z-index:1; color:#6b7280; font-size:var(--base); pointer-events:none; text-align:center; padding:6px 8px}
.photo img{max-width:100%; max-height:100%; display:block}

/* التواقيع */
.signatures{height:22mm; display:grid; grid-template-columns:1fr 1fr; gap:4mm}
.sig{
  background:#fff; border:1px solid var(--line); border-radius:8px;
  display:grid; grid-template-rows:9mm 1fr; text-align:center;
}
.sig h4{margin:0; display:grid; place-items:center; color:#1597a0; font-weight:800; font-size:var(--name); border-bottom:1px solid var(--line)}
.sig .name{font-weight:800; font-size:var(--name); display:grid; place-items:center}

/* الشريط السفلي */
.footer-bar{height:6mm; background:var(--footer)}

/* أدوات أعلى الصفحة (لا تظهر في PDF) */
.actions{position:fixed; top:10px; right:10px; left:10px; display:flex; gap:8px; z-index:9999}
.btn{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--accent); color:#fff; font-weight:700; padding:8px 12px; border-radius:10px; cursor:pointer; font-size:var(--base); box-shadow:0 4px 10px rgba(0,0,0,.08)}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.select{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-weight:700}

@media (max-width:600px){ .sheet{transform:scale(0.92); transform-origin:top center;} }
.toast{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 14px; border-radius:10px; font-size:13px; z-index:99999; opacity:.98;}
</style>
</head>
<body>

<!-- أدوات التحكم العامة (تظهر في المتصفح فقط) -->
<div class="actions" data-nopdf="true">
  <button class="btn" id="btnPdf" type="button" title="حفظ PDF">حفظ PDF</button>
  <select id="pdfQuality" class="select" title="جودة PDF">
    <option value="normal">جودة: عادي</option>
    <option value="high">جودة: عالي</option>
  </select>
</div>

<div class="sheet" id="sheet">
  <!-- الهيدر -->
  <div class="header-img">
    <img id="headerPic" src="header.jpg" alt="هيدر وزارة التعليم" crossOrigin="anonymous">
    <div class="header-fallback" id="headerFallback"></div>
  </div>

  <!-- العنوان -->
  <div class="titlebar-wrap">
    <div class="titlebar" id="titlebar" contenteditable="true">تقرير تنفيذ برنامج (قابل للتعديل)</div>
  </div>

  <!-- المحتوى الثابت -->
  <div class="main">

    <!-- جدول التعريف (مُصغّر ومرفوع) -->
    <table class="table" role="table" aria-label="بيانات البرنامج">
      <tr>
        <th contenteditable="true">مقدّم البرنامج</th>
        <td contenteditable="true">اسم الجهة المنفذة</td> <!-- تم التعديل هنا -->
        <th contenteditable="true">المكان</th>
        <td contenteditable="true"></td>
      </tr>
      <tr>
        <th contenteditable="true">التاريخ (هجري أم القرى)</th>
        <td id="hijriDate" contenteditable="true"></td>
        <th contenteditable="true">المستفيدون</th>
        <td contenteditable="true"></td>
      </tr>
      <tr>
        <th contenteditable="true">عدد الحضور</th>
        <td contenteditable="true"></td>
        <th contenteditable="true">مدة البرنامج</th>
        <td contenteditable="true"></td>
      </tr>
    </table>

    <!-- الأهداف + النبذة (ثابتان) -->
    <div class="split">
      <div class="card">
        <div class="head">الأهداف</div>
        <div class="toolstrip" data-nopdf="true">
          <button class="toolbtn" onclick="adjText('goalsText', +1)">+A</button>
          <button class="toolbtn" onclick="adjText('goalsText', -1)">−A</button>
          <button class="toolbtn" onclick="toggleBold('goalsText')">B</button>
        </div>
        <div class="body">
          <div id="goalsText" class="fittext" contenteditable="true">اكتب الأهداف هنا…</div>
        </div>
      </div>

      <div class="card">
        <div class="head">نبذة عن البرنامج</div>
        <div class="toolstrip" data-nopdf="true">
          <button class="toolbtn" onclick="adjText('aboutText', +1)">+A</button>
          <button class="toolbtn" onclick="adjText('aboutText', -1)">−A</button>
          <button class="toolbtn" onclick="toggleBold('aboutText')">B</button>
        </div>
        <div class="body">
          <div id="aboutText" class="fittext" contenteditable="true">اكتب النبذة هنا…</div>
        </div>
      </div>
    </div>

    <!-- الشواهد (ثابت) -->
    <div class="gallery">
      <div class="photo" data-slot="1">
        <input type="file" accept="image/*" onchange="handlePhoto(this)">
        <div class="hint">أضف صورة (1/2)</div>
      </div>
      <div class="photo" data-slot="2">
        <input type="file" accept="image/*" onchange="handlePhoto(this)">
        <div class="hint">أضف صورة (2/2)</div>
      </div>
    </div>

    <!-- التواقيع -->
    <div class="signatures">
      <div class="sig">
        <h4 contenteditable="true">رائد النشاط</h4>
        <div class="name" contenteditable="true">اسم المعلم</div>
      </div>
      <div class="sig">
        <h4>مدير المدرسة</h4>
        <div class="name">فهد حامد علي الزهراني</div>
      </div>
    </div>
  </div>

  <div class="footer-bar" aria-hidden="true"></div>
</div>

<script>
/* ====== أدوات عامة ====== */
const STORAGE_KEY='school_report_v6';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }
function setBusy(b){ const btn=document.getElementById('btnPdf'); const sel=document.getElementById('pdfQuality'); [btn,sel].forEach(el=>{ if(el) el.disabled=!!b; }); }

/* FitText (ثابت) */
function fitTextToBox(el, {minSize=12, maxSize=20, baseSize=15}={}){
  if(!el) return;
  const parent=el.parentElement, maxH=parent.clientHeight, maxW=parent.clientWidth;
  let s = parseFloat(getComputedStyle(el).fontSize) || baseSize;
  s = Math.max(minSize, Math.min(maxSize, s));
  const set=sz=>{ el.style.fontSize=sz+'px'; el.style.lineHeight=Math.max(1.25, Math.min(1.6, 1.3 + (sz-12)*0.05)); };
  el.style.whiteSpace='pre-wrap'; el.style.wordBreak='break-word'; el.style.overflow='hidden';
  set(s);
  let g=0; while(g++<90 && (el.scrollHeight>maxH || el.scrollWidth>maxW) && s>minSize){ s-=0.5; set(s); }
  g=0; const roomy=()=> el.scrollHeight<maxH*.92 && el.scrollWidth<maxW*.96;
  while(g++<60 && roomy() && s<maxSize){ s+=0.5; set(s); if(el.scrollHeight>maxH || el.scrollWidth>maxW){ s-=0.5; set(s); break; } }
  if (el.scrollHeight>maxH-2 || s<=minSize) el.dataset.full='1'; else delete el.dataset.full;
}

/* أدوات النص */
function adjText(id, dir){ const el=document.getElementById(id); if(!el) return; const cur=parseFloat(getComputedStyle(el).fontSize)||15; const next=Math.max(12, Math.min(20, cur + (dir>0 ? 1 : -1))); el.style.fontSize=next+'px'; fitTextToBox(el); }
function toggleBold(id){ const el=document.getElementById(id); if(!el) return; el.style.fontWeight=(getComputedStyle(el).fontWeight >= '600') ? '400' : '700'; fitTextToBox(el); }

/* لصق نص صِرف */
function installPlainPaste(el){ el.addEventListener('paste', (e)=>{ e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text'); document.execCommand('insertText', false, t); }); }

/* ضغط وتحويل صورة <img> إلى DataURL (تقنين الصور) */
async function imageToDataURL(img, {maxSide=2000, quality=0.92}={}){
  await (img.decode ? img.decode().catch(()=>{}) : new Promise(res=>{ if(img.complete&&img.naturalWidth>0) return res(); img.addEventListener('load',res,{once:true}); img.addEventListener('error',res,{once:true}); }));
  const w=img.naturalWidth, h=img.naturalHeight, scale=Math.min(1, maxSide/Math.max(w,h));
  const nw=Math.max(1,Math.floor(w*scale)), nh=Math.max(1,Math.floor(h*scale));
  const c=document.createElement('canvas'); c.width=nw; c.height=nh; const x=c.getContext('2d',{alpha:false}); x.imageSmoothingQuality='high'; x.drawImage(img,0,0,nw,nh);
  return c.toDataURL('image/jpeg', quality);
}

/* صور الشواهد (خلفية cover + contain وسط) */
function renderContainedPrettyFromFile(file, box){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=async ()=>{
      try{
        const tmp=new Image(); tmp.src=await imageToDataURL(img,{maxSide:2000, quality:0.9});
        await (tmp.decode ? tmp.decode().catch(()=>{}) : Promise.resolve());
        const dpr=Math.min(window.devicePixelRatio||1, 2.5);
        const bw=Math.max(1,Math.floor(box.clientWidth*dpr)), bh=Math.max(1,Math.floor(box.clientHeight*dpr));
        const c=document.createElement('canvas'); c.width=bw; c.height=bh; const ctx=c.getContext('2d',{alpha:false});
        const cover=Math.max(bw/tmp.naturalWidth, bh/tmp.naturalHeight);
        const cw=Math.floor(tmp.naturalWidth*cover), ch=Math.floor(tmp.naturalHeight*cover);
        const cx=Math.floor((bw-cw)/2), cy=Math.floor((bh-ch)/2);
        ctx.filter='blur(18px) brightness(1.03)'; ctx.drawImage(tmp,cx,cy,cw,ch); ctx.filter='none';
        ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(0,0,bw,bh);
        const contain=Math.min(bw/tmp.naturalWidth, bh/tmp.naturalHeight);
        const dw=Math.floor(tmp.naturalWidth*contain), dh=Math.floor(tmp.naturalHeight*contain);
        const dx=Math.floor((bw-dw)/2), dy=Math.floor((bh-dh)/2);
        ctx.imageSmoothingQuality='high'; ctx.drawImage(tmp,dx,dy,dw,dh);
        resolve(c.toDataURL('image/jpeg', 0.92));
      }catch(e){ reject(e); }
      URL.revokeObjectURL(url);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('تعذّر قراءة الصورة')); };
    img.src=url;
  });
}
async function handlePhoto(inputEl){
  const f=inputEl?.files?.[0]; if(!f) return; const box=inputEl.parentElement; box.querySelector('.hint')?.remove();
  try{ const dataUrl=await renderContainedPrettyFromFile(f, box); let img=box.querySelector('img'); if(!img){ img=document.createElement('img'); box.appendChild(img); } img.src=dataUrl; saveState(); }
  catch(e){ console.error(e); toast('تعذّر معالجة الصورة'); }
}

/* انتظار وتحويل كل صور الورقة لضمان ظهورها في PDF */
async function waitForImagesReady(){
  const imgs=Array.from(document.querySelectorAll('#sheet img')).filter(im=>im && im.src);
  for(const im of imgs){ if(!im.src.startsWith('data:image')){ try{ im.src=await imageToDataURL(im,{maxSide:2000, quality:0.92}); }catch(e){} } }
  const waitOne=im=> (im.complete&&im.naturalWidth>0)?Promise.resolve():(im.decode?im.decode().catch(()=>Promise.resolve()):new Promise(res=>{im.addEventListener('load',res,{once:true}); im.addEventListener('error',res,{once:true});}));
  await Promise.all(imgs.map(waitOne)); await new Promise(r=>setTimeout(r,60));
}

/* الهيدر: إظهار بديل عند الفشل */
(function ensureHeader(){
  const img=document.getElementById('headerPic'), fb=document.getElementById('headerFallback');
  let done=false; const ok=()=>{ if(!done){done=true; fb.style.display='none'; }}; const fail=()=>{ if(!done){done=true; fb.style.display='block'; }};
  if (img.complete && img.naturalWidth>0) ok(); else { img.addEventListener('load',ok,{once:true}); img.addEventListener('error',fail,{once:true}); setTimeout(()=>{ if(!done) fail(); },1500); }
})();

/* التاريخ الهجري الافتراضي */
(function(){ try{ const el=document.getElementById('hijriDate'); if(el && !el.textContent.trim()){ const fmt=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'2-digit',month:'long',year:'numeric'}); el.textContent=fmt.format(new Date()); } }catch{} })();

/* حفظ/استرجاع */
function collectState(){
  const getHTML=id=>document.getElementById(id)?.innerHTML||'';
  const photos=Array.from(document.querySelectorAll('.gallery .photo')).map(p=> p.querySelector('img')?.src || '');
  const table=Array.from(document.querySelectorAll('.table th, .table td')).map(c=> c.innerHTML);
  return {
    title:getHTML('titlebar'), hijri:getHTML('hijriDate'),
    goals:getHTML('goalsText'), about:getHTML('aboutText'),
    sig1h:document.querySelector('.signatures .sig:nth-child(1) h4')?.innerHTML||'',
    sig1n:document.querySelector('.signatures .sig:nth-child(1) .name')?.innerHTML||'',
    sig2h:document.querySelector('.signatures .sig:nth-child(2) h4')?.innerHTML||'',
    sig2n:document.querySelector('.signatures .sig:nth-child(2) .name')?.innerHTML||'',
    photos, table
  };
}
function applyState(s){
  if(!s) return;
  const setHTML=(id,val)=>{ const el=document.getElementById(id); if(el) el.innerHTML=val; };
  setHTML('titlebar',s.title); setHTML('hijriDate',s.hijri); setHTML('goalsText',s.goals); setHTML('aboutText',s.about);
  const s1h=document.querySelector('.signatures .sig:nth-child(1) h4'); if(s1h) s1h.innerHTML=s.sig1h;
  const s1n=document.querySelector('.signatures .sig:nth-child(1) .name'); if(s1n) s1n.innerHTML=s.sig1n;
  const s2h=document.querySelector('.signatures .sig:nth-child(2) h4'); if(s2h) s2h.innerHTML=s.sig2h;
  const s2n=document.querySelector('.signatures .sig:nth-child(2) .name'); if(s2n) s2n.innerHTML=s.sig2n;
  if(Array.isArray(s.table)){ const cells=Array.from(document.querySelectorAll('.table th, .table td')); s.table.forEach((v,i)=>{ if(cells[i]) cells[i].innerHTML=v; }); }
  if(Array.isArray(s.photos)){ const boxes=Array.from(document.querySelectorAll('.gallery .photo')); s.photos.forEach((src,i)=>{ if(!src) return; let img=boxes[i].querySelector('img'); if(!img){ img=document.createElement('img'); boxes[i].appendChild(img); } img.src=src; boxes[i].querySelector('.hint')?.remove(); }); }
  refitAll();
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); }
function restoreState(){ try{ const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null'); applyState(s); }catch{} }

/* PDF صفحة واحدة */
async function generateSinglePagePdf(){
  const qSel=document.getElementById('pdfQuality').value;
  const scale = qSel==='high' ? Math.min(window.devicePixelRatio||2, 3) : Math.min(window.devicePixelRatio||1.5, 2.2);
  const jpegQ = qSel==='high' ? 0.98 : 0.92;
  await waitForImagesReady();
  const sheet=document.getElementById('sheet');
  const canvas=await html2canvas(sheet,{
    scale, backgroundColor:'#ffffff', useCORS:true, allowTaint:false,
    scrollX:0, scrollY:-window.scrollY, imageTimeout:2000,
    ignoreElements:(el)=> el?.dataset?.nopdf==='true' || el?.tagName==='INPUT'
  });
  const imgData=canvas.toDataURL('image/jpeg', jpegQ);
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF({orientation:'p', unit:'mm', format:'a4'});
  const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
  const imgW_byWidth=pageW, imgH_byWidth=(canvas.height*imgW_byWidth)/canvas.width;
  const imgH_byHeight=pageH, imgW_byHeight=(canvas.width*imgH_byHeight)/canvas.height;
  const fitByWidth = imgH_byWidth<=pageH;
  const drawW = fitByWidth? imgW_byWidth : imgW_byHeight;
  const drawH = fitByWidth? imgH_byWidth : imgH_byHeight;
  const ox=(pageW-drawW)/2, oy=(pageH-drawH)/2;
  pdf.addImage(imgData,'JPEG',ox,oy,drawW,drawH,undefined,'FAST');
  const title=(document.getElementById('titlebar').innerText||'تقرير').replace(/[\\\/:*?"<>|]+/g,' ').trim();
  const hijri=(document.getElementById('hijriDate').innerText||'').replace(/\s+/g,' ').trim();
  const filename=`${(title||'تقرير')} - ${hijri||''}`.replace(/\s{2,}/g,' ') + '.pdf';
  return { pdf, filename };
}

/* تنبيهات امتلاء */
function checkFillWarnings(){
  const boxes=[document.getElementById('goalsText'), document.getElementById('aboutText')];
  const over = boxes.some(el => el?.dataset?.full==='1');
  if (over) toast('تنبيه: النص ممتلئ جدًا — قلّل المحتوى أو حجم الخط');
}

/* تفعيل الأدوات والملاءمة */
function refitAll(){
  fitTextToBox(document.getElementById('goalsText'));
  fitTextToBox(document.getElementById('aboutText'));
  checkFillWarnings();
}
function bindUI(){
  // لصق آمن + FitText
  ['goalsText','aboutText'].forEach(id=>{
    const el=document.getElementById(id);
    installPlainPaste(el);
    const fitNow=()=>{ fitTextToBox(el); checkFillWarnings(); saveState(); };
    ['input','keyup','blur'].forEach(evt=> el.addEventListener(evt, fitNow));
    const ro=new ResizeObserver(()=>{ fitTextToBox(el); checkFillWarnings(); }); ro.observe(el); ro.observe(el.parentElement);
  });

  // العنوان — ملاءمة مبسطة
  const title=document.getElementById('titlebar');
  function fitTitle(){
    const wrap=title.parentElement; const maxW=wrap.clientWidth*.72; let s=18, min=14, max=22;
    const set=x=>{ title.style.fontSize=x+'px'; title.style.lineHeight=1.25; };
    set(s); let i=0; while(i++<60 && title.scrollWidth>maxW && s>min){ s-=0.5; set(s); }
    i=0; while(i++<60 && title.scrollWidth<maxW*.9 && s<max){ s+=0.5; set(s); if(title.scrollWidth>maxW){ s-=0.5; set(s); break; } }
  }
  ['input','keyup'].forEach(evt=> title.addEventListener(evt, ()=>{ fitTitle(); saveState(); }));
  const roT=new ResizeObserver(fitTitle); roT.observe(title); roT.observe(title.parentElement); fitTitle();

  // زر PDF
  document.getElementById('btnPdf')?.addEventListener('click', async ()=>{
    try{ setBusy(true); saveState(); const {pdf, filename}=await generateSinglePagePdf(); pdf.save(filename); toast('تم إنشاء PDF ✅'); }
    catch(e){ console.error(e); alert('تعذّر إنشاء PDF.'); }
    finally{ setBusy(false); }
  });

  // حفظ تلقائي
  document.querySelectorAll('[contenteditable], .table th, .table td').forEach(el=>{
    ['input','keyup','blur'].forEach(evt=> el.addEventListener(evt, saveState));
  });
}

/* إقلاع */
document.addEventListener('DOMContentLoaded', ()=>{
  restoreState();
  refitAll();
  bindUI();
});
window.addEventListener('resize', ()=>{ clearTimeout(window.__ftR); window.__ftR=setTimeout(()=>{ refitAll(); }, 120); });
</script>

</body>
